# =============================================================================
# Redis Configuration - Threat Detection Platform (Development)
# =============================================================================

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Disable persistence (Redis is cache/pubsub only, PostgreSQL is source of truth)
save ""
appendonly no

# Network
bind 0.0.0.0
protected-mode no
tcp-keepalive 300
timeout 0

# Logging
loglevel notice
